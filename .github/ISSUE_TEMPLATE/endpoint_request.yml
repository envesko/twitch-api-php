name: Missing endpoint
description: A Helix endpoint or EventSub subscription this library does not cover
labels: ["endpoint"]
body:
  - type: markdown
    attributes:
      value: |
        As of 7.3.0 the library covers all 149 documented Helix endpoints and 79
        EventSub subscription types, so a gap usually means Twitch has published
        something new. Please link the reference page.
  - type: input
    id: reference
    attributes:
      label: Link to the Twitch reference page
      placeholder: "https://dev.twitch.tv/docs/api/reference/#..."
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind
      options:
        - Helix endpoint
        - EventSub subscription type
        - A new version of an existing subscription type
    validations:
      required: true
  - type: checkboxes
    id: offer
    attributes:
      label: Would you like to add it
      options:
        - label: I am willing to open a pull request
