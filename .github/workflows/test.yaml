---
name: Run tests

on:
  pull_request:
    branches:
    - master
  push:
    branches:
    - master

# Both jobs only read the repository. Without this, the workflow inherits the
# default token permissions, which on a public repo is read but on a private
# one is read and write for every scope.
permissions:
  contents: read

jobs:
  test:
    name: "PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"

      # Cache Composer dependencies, based on the example at https://github.com/actions/cache/blob/main/examples.md#php---composer
      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php${{ matrix.php }}-composer-

      - name: Install dependencies using Composer
        run: composer install --prefer-dist --no-interaction

      - name: Run tests
        run: make test

  lowest:
    name: "Lowest supported dependencies"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # composer.json promises Guzzle from 7.15.2 and psr/http-message from 1.1
      # upward, but a normal install always resolves the newest of each, so the
      # bottom of every range goes untested. A consumer pinned there by another
      # package would be the first to run it.
      - name: Install the oldest allowed versions of every dependency
        run: composer update --prefer-lowest --prefer-stable --no-interaction

      - name: Run tests
        run: make test
